services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kootenwaye
      POSTGRES_PASSWORD: kootenwaye_dev
      POSTGRES_DB: kootenwaye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kootenwaye -d kootenwaye"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
