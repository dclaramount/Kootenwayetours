# Uses Traefik, which is already running on the cluster (k3s default).
#
# TLS: Cloudflare Origin CA cert (not cert-manager — see infra/k8s/README.md
# "Cluster context" for why). The `kootenwayetours-tls` Secret was created
# imperatively from that cert/key (never committed to this repo) and
# already exists on the cluster. Cloudflare's SSL/TLS mode needs to be
# "Full (strict)" for this to actually be used/validated — see README.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kootenwayetours
  namespace: kootenwayetours
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kootenwayetours.com
        - www.kootenwayetours.com
      secretName: kootenwayetours-tls
  rules:
    - host: kootenwayetours.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
    - host: www.kootenwayetours.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
