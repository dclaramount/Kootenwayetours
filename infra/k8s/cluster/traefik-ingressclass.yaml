# Cluster-level platform resource, applied separately from the app
# manifests (same reasoning as traefik-loadbalancer.yaml in this
# directory). This cluster's Traefik was installed without ever
# registering an IngressClass object — Ingress resources that set
# `ingressClassName: traefik` (ours included) go completely unmatched and
# silently fall back to Traefik's self-signed default cert, with no error
# anywhere. This is the missing piece.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller
