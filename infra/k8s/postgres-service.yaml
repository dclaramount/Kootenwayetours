# Headless service — required for the StatefulSet, and gives the app a
# stable DNS name: postgres.kootenwayetours.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kootenwayetours
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
