# TEMPLATE ONLY — shows the shape of the Secret the app and Postgres expect.
# Do not fill in real values here and apply this file; it will end up
# checked into git in plaintext. Instead, create the real Secret
# imperatively (see infra/k8s/README.md), which never writes the values
# to disk in this repo.
apiVersion: v1
kind: Secret
metadata:
  name: kootenwayetours-secrets
  namespace: kootenwayetours
type: Opaque
stringData:
  POSTGRES_USER: "kootenwaye"
  # Generate with: openssl rand -hex 24
  # NOT `openssl rand -base64` — it can produce `/` or `+`, both of which
  # break unescaped inside the DATABASE_URL below (P1013: invalid port
  # number, since `/` reads as a path separator). Learned this the hard way
  # deploying — see infra/k8s/README.md "Deployed state".
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "kootenwaye"
  # Must match the three values above and the in-cluster postgres Service name.
  DATABASE_URL: "postgresql://kootenwaye:REPLACE_ME@postgres.kootenwayetours.svc.cluster.local:5432/kootenwaye?schema=public"
  # Generate with: openssl rand -base64 32 (fine here — not used inside a URL)
  SESSION_SECRET: "REPLACE_ME"
