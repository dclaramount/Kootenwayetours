apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: kootenwayetours
  labels:
    app: kootenwayetours
spec:
  # Deliberately 1: the uploads PVC below is ReadWriteOnce, so only one pod
  # can mount it at a time. Moving uploads to Civo Object Storage is the
  # documented upgrade path if this ever needs to scale out
  # (see planning-design/iteration-1 §13).
  replicas: 1
  strategy:
    # RollingUpdate would briefly try to run two pods, and the second can't
    # mount the RWO uploads volume. Recreate accepts a short gap on deploy
    # instead of a stuck rollout.
    type: Recreate
  selector:
    matchLabels:
      app: kootenwayetours
  template:
    metadata:
      labels:
        app: kootenwayetours
    spec:
      containers:
        - name: app
          image: ghcr.io/dclaramount/kootenwayetours:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: kootenwayetours-config
            - secretRef:
                name: kootenwayetours-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 320Mi
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            # This node is heavily CPU-contended (1 vCPU shared across every
            # pod on the cluster) and /api/ready does a real DB round-trip —
            # the Kubernetes default 1s probe timeout is too tight here and
            # was causing false-positive failures/restarts under load, not
            # actual app errors (nothing in the app logs, ever).
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads
