# Small in-cluster Postgres pod, per planning-design/iteration-1: a
# StatefulSet with its own PVC, separate from the app's uploads volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kootenwayetours
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: kootenwayetours-secrets
          # Sized for the current small (1 vCPU / ~940Mi) node — raise these
          # once the cluster has more headroom.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 320Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: civo-volume
        resources:
          requests:
            # Separate from — and not counted against — the app's 5Gi
            # uploads volume. Adjust as content/traffic grows.
            storage: 2Gi
